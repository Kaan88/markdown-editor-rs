[package]
name = "frosted-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Power",
] }

# The same forks, at the same commits, as the app's root Cargo.toml.
[patch.crates-io]
winit = { git = "https://github.com/Kaan88/winit", rev = "89ace86e65387b44cec55730e5691e894b451722" }
softbuffer = { git = "https://github.com/Kaan88/softbuffer", rev = "dd18fec9d08e2f466c42d4c2cece62aa0ee1eba9" }

[workspace]

[profile.release]
opt-level = 3
