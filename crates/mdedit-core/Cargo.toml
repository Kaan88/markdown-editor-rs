[package]
name = "mdedit-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "mdedit's headless core: the text buffer, loading and encodings, line endings, display columns, selection and find."

[dependencies]
ropey.workspace = true
encoding_rs.workspace = true
unicode-segmentation.workspace = true
memchr.workspace = true
chardetng.workspace = true
unicode-width.workspace = true
mdshared-app.workspace = true

# Saving replaces the file with ReplaceFileW, which keeps its attributes, ACL, creation time and
# alternate streams. That call is the crate's one `unsafe` block (see `save.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
