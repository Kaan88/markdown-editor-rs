[package]
name = "mdedit"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "mdedit: the winit + softbuffer shell. Every control is drawn by this crate or by mdshared-ui."

[features]
default = ["embedded-preview"]
# Draws the preview pane in this process with mdview's renderer built in. Without it
# (--no-default-features) the installed mdview draws it in its own process, kept to compare.
embedded-preview = ["mdview-preview/server", "dep:mdview-render"]

[[bin]]
name = "mdedit"
path = "src/main.rs"

[dependencies]
ropey.workspace = true
unicode-segmentation.workspace = true
mdedit-core = { path = "../../crates/mdedit-core" }
mdedit-highlight = { path = "../../crates/mdedit-highlight" }
mdedit-outline = { path = "../../crates/mdedit-outline" }
mdshared-app.workspace = true
mdshared-fetch.workspace = true
mdshared-text.workspace = true
mdshared-ui.workspace = true
parley.workspace = true
# Views softbuffer's u32 pixels as bytes, so presenting is a row memcpy.
bytemuck.workspace = true
# The PNG a Windows clipboard bitmap is saved as; already in the build through mdshared-text.
png = "0.18"
# The preview pane (src/preview_pane.rs). The wire format to `mdview --preview-server` always;
# mdview's renderer itself only in the embedded build (the feature below).
mdview-preview = { git = "https://github.com/Kaan88/markdown-viewer-rs", rev = "31338dae9b179a68b90c06353cc128d8493b12c6" }
mdview-render = { git = "https://github.com/Kaan88/markdown-viewer-rs", rev = "31338dae9b179a68b90c06353cc128d8493b12c6", optional = true }

[target.'cfg(windows)'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }
# The Save as dialog; the same version and features as mdshared-ui, which opens the others.
rfd = { version = "0.15.4", default-features = false }
# GetACP (Globalization), the memory figures --trace prints (ProcessStatus, Threading) and the
# first line of the clipboard for the find box (DataExchange, Memory).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

# macOS: AppKit through winit, and the pasteboard for pasting a picture or copied files. The
# objc2 crates are the versions arboard already brings in.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"] }
# The memory and CPU figures --trace prints (proc_pid_rusage, getrusage). Already in the build.
libc = "0.2"
