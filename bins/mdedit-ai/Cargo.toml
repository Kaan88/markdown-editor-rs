[package]
name = "mdedit-ai"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "mdedit's AI engine: talks to Claude Code, Codex, the Claude API and OpenAI-compatible APIs for mdedit, over JSON lines on stdin and stdout. A separate process, so nothing it does can end the editor."

[[bin]]
name = "mdedit-ai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API keys in Windows Credential Manager, the macOS Keychain or the Secret Service (pure Rust
# D-Bus on Linux).
keyring = "=4.2.0"
# Names a custom endpoint's key by a digest of its URL (fixed length, case kept).
sha2 = "0.11"

# HTTPS with the system's own TLS and certificates where there is one: SChannel on Windows (with
# the system proxy from the registry), Security.framework on macOS. Linux has rustls with the
# system's certificates. Plain HTTP for the local servers (Ollama, LM Studio).
[target.'cfg(windows)'.dependencies]
ureq = { version = "=3.5.2", default-features = false, features = ["native-tls-no-default", "win-system-proxy"] }
[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "=3.5.2", default-features = false, features = ["native-tls-no-default"] }
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
