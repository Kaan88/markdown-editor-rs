# The preview pane's Windows test app, from the f/preview-pane branches of mdedit and mdview:
# builds mdview (with its engine) and both builds of mdedit's pane, times them on the runner and
# packs one zip with a folder for each build. Not a release: no installer, no signature.
name: preview-test

on:
  push:
    branches: [f/preview-pane]
  workflow_dispatch:

concurrency:
  group: preview-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.99.1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: editor
      - uses: actions/checkout@v4
        with:
          repository: Kaan88/markdown-viewer-rs
          ref: f/preview-pane
          path: viewer
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: preview-test
          workspaces: |
            editor
            viewer
      - name: Build mdview and both mdedit builds
        shell: bash
        run: |
          (cd viewer && cargo build --release -p mdview -p mdview-engine)
          cd editor
          cargo build --release -p mdedit
          mkdir -p ../out/renderer ../out/embedded
          cp target/release/mdedit.exe ../out/renderer/
          cargo build --release -p mdedit --features embedded-preview
          cp target/release/mdedit.exe ../out/embedded/
          for d in renderer embedded; do
            cp ../viewer/target/release/mdview.exe ../viewer/target/release/mdview-engine.exe ../out/$d/
          done
          cp ../viewer/fixtures/everything.md ../out/everything.md
          cp ../viewer/docs/PLAN.md ../out/plan.md
          ls -l ../out ../out/*
      - name: The pane's tests against this mdview
        shell: bash
        env:
          MDEDIT_TEST_MDVIEW: ${{ github.workspace }}\out\renderer\mdview.exe
        run: |
          cd editor
          cargo test --release -p mdedit preview
          cargo test --release -p mdedit --features embedded-preview preview
      - name: Timings (a real window on the runner)
        shell: pwsh
        continue-on-error: true
        run: |
          $out = "$env:GITHUB_WORKSPACE\out"
          function Run($build, $file, $extra) {
            $exe = "$out\$build\mdedit.exe"
            $err = "$out\err.txt"
            $argv = @('--no-session', '--trace', '--size', '1400x900') + $extra + @("$out\$file")
            $p = Start-Process -FilePath $exe -ArgumentList $argv -RedirectStandardError $err -PassThru
            Start-Sleep -Milliseconds 3000
            $kids = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)"
            $me = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).PrivateMemorySize64
            $line = "MEM $build $file mdedit {0:N1} MiB" -f ($me / 1MB)
            foreach ($k in $kids) {
              $km = (Get-Process -Id $k.ProcessId -ErrorAction SilentlyContinue).PrivateMemorySize64
              $line += "; $($k.Name) {0:N1} MiB" -f ($km / 1MB)
            }
            if (-not $p.WaitForExit(120000)) { $p.Kill() }
            Write-Output $line
            Get-Content $err | Select-String -Pattern 'first frame after|memory|preview|keystroke' | ForEach-Object { "  $_" }
          }
          foreach ($b in 'renderer', 'embedded') {
            foreach ($f in 'everything.md', 'plan.md') {
              Write-Output "== $b $f, no pane"
              Run $b $f @('--exit-after-ms', '4000')
              Write-Output "== $b $f, pane"
              Run $b $f @('--exit-after-ms', '4000', '--preview-pane')
              foreach ($i in 1..3) {
                Write-Output "== $b $f, typing $i"
                Run $b $f @('--type-steps', '300', '--preview-pane')
              }
            }
          }
      - name: Pictures of the pane
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p out/shots
          for b in renderer embedded; do
            out/$b/mdedit.exe --no-session --size 1400x860 --scale 1 --preview-pane --shot out/shots/$b-light.png out/everything.md
            out/$b/mdedit.exe --no-session --dark --size 1400x860 --scale 1.5 --preview-pane --shot out/shots/$b-dark.png out/plan.md
          done
          ls -l out/shots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: preview-shots-windows
          path: out/shots/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: The test zip
        shell: bash
        run: |
          mkdir -p dist/mdedit-preview-test
          cp -r out/renderer out/embedded out/everything.md dist/mdedit-preview-test/
          cat > dist/mdedit-preview-test/README.txt <<'EOF'
          mdedit preview pane, Windows test build (not a release).

          renderer\mdedit.exe   the page is drawn by mdview --preview-server, in its own process
          embedded\mdedit.exe   the page is drawn by mdview's renderer inside mdedit

          Each folder has the mdview it uses beside it. Run one mdedit at a time: the two
          share their single-instance channel and settings. Open a .md file and press
          Preview in the bar (or View > Preview in this window).
          EOF
          cd dist && 7z a -tzip ../mdedit-preview-test-windows.zip mdedit-preview-test >/dev/null
          ls -l ../mdedit-preview-test-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mdedit-preview-test-windows
          path: mdedit-preview-test-windows.zip
          retention-days: 30
